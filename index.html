<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOFY 40+</title>
<meta name="description" content="SOFY 40+ e ofertas das nossas lojas parceiras.">
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f6f7;color:#171717;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{background:#111;color:#fff;text-align:center;padding:32px 16px}h1{margin:0;font-size:28px}header p{color:#ccc;margin:8px auto;max-width:650px}
main{max-width:1180px;margin:auto;padding:20px 14px 40px}.controls{display:flex;gap:10px;flex-wrap:wrap}
input,select{padding:13px;border:1px solid #ddd;border-radius:12px;background:#fff;font-size:15px}input{flex:1;min-width:220px}
.cats{display:flex;gap:8px;overflow:auto;padding:15px 0}.cats button{border:1px solid #ddd;background:#fff;border-radius:99px;padding:9px 14px;white-space:nowrap}.cats .active{background:#111;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 3px 16px #0001;display:flex;flex-direction:column}
.pic{position:relative;background:#eee}.pic img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.badge{position:absolute;top:10px;left:10px;background:#111;color:#fff;padding:6px 9px;border-radius:8px;font-size:12px}
.body{padding:15px;display:flex;flex-direction:column;flex:1}.cat{font-size:11px;color:#777;text-transform:uppercase}.title{font-size:18px;font-weight:750;margin:5px 0}.desc{font-size:14px;color:#777;line-height:1.4;min-height:40px}
.prices{display:flex;align-items:baseline;gap:8px;margin:11px 0}.old{text-decoration:line-through;color:#999;font-size:14px}.price{font-size:21px;font-weight:850}.discount{font-size:12px;font-weight:750}
.partner{font-size:12px;color:#777;margin-bottom:10px}.btn{display:block;text-align:center;text-decoration:none;background:#111;color:#fff;padding:12px;border-radius:11px;font-weight:750}
.count{font-size:13px;color:#777;margin:0 0 12px}.empty{text-align:center;padding:50px;color:#777;grid-column:1/-1}
footer{text-align:center;color:#888;font-size:12px;padding:25px}
</style>
</head>
<body>
<header><h1 id="brand">Produtos recomendados</h1><p id="subtitle">SOFY 40+, com ligação às lojas parceiras.</p></header>
<main>
<div class="controls">
<input id="search" placeholder="🔎 Pesquisar produtos..." oninput="render()">
<select id="sort" onchange="render()">
<option value="featured">Destaques primeiro</option><option value="priceAsc">Preço menor → maior</option>
<option value="priceDesc">Preço maior → menor</option><option value="name">Nome A → Z</option>
</select>
</div>
<div id="cats" class="cats"></div><div id="count" class="count"></div><div id="grid" class="grid"></div>
</main>
<footer>Alguns links podem ser links de afiliado. A compra é efetuada diretamente no parceiro.</footer>
<script>
const SHEET_CSV_URL="https://drive.google.com/file/d/1sL07gHVzGu5p84culnJA-kWCXbedgA6n/view?usp=sharing";
const BRAND_NAME="SOFY 40+";
const SUBTITLE="As nossas sugestões, com ligação direta às lojas parceiras.";
let products=[],selectedCategory="";
function parseCSV(t){let a=[],r=[],c="",q=false;for(let i=0;i<t.length;i++){let x=t[i],n=t[i+1];if(x=='"'&&q&&n=='"'){c+='"';i++}else if(x=='"')q=!q;else if(x==','&&!q){r.push(c);c=""}else if((x=='\n'||x=='\r')&&!q){if(x=='\r'&&n=='\n')i++;r.push(c);if(r.some(v=>v.trim()))a.push(r);r=[];c=""}else c+=x}if(c||r.length){r.push(c);a.push(r)}let h=a.shift().map(v=>v.trim().toLowerCase());return a.map(v=>Object.fromEntries(h.map((k,i)=>[k,(v[i]||"").trim()])))}
function num(v){return parseFloat(String(v||"").replace(/[^\d,.-]/g,"").replace(/\.(?=\d{3}(?:\D|$))/g,"").replace(",", "."))||0}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function demo(){return[{ativo:"SIM",nome:"Produto de exemplo",categoria:"Destaques",imagem:"https://placehold.co/700x700?text=Produto",preco:"199,90 €",preco_anterior:"249,90 €",descricao:"Substitua este produto pelos seus dados.",parceiro:"Loja parceira",url:"https://example.com",destaque:"SIM"}]}
async function load(){products=SHEET_CSV_URL.startsWith("COLE_")?demo():parseCSV(await(await fetch(SHEET_CSV_URL)).text());buildCats();render()}
function buildCats(){let c=[...new Set(products.filter(p=>p.ativo.toUpperCase()=="SIM").map(p=>p.categoria).filter(Boolean))].sort();document.getElementById("cats").innerHTML='<button class="active" onclick="setCat(this,\'\')">Todos</button>'+c.map(x=>'<button onclick="setCat(this,\\''+esc(x)+'\\')">'+esc(x)+'</button>').join("")}
function setCat(e,c){selectedCategory=c;document.querySelectorAll(".cats button").forEach(x=>x.classList.remove("active"));e.classList.add("active");render()}
function render(){let q=document.getElementById("search").value.toLowerCase(),s=document.getElementById("sort").value;
let a=products.filter(p=>p.ativo.toUpperCase()=="SIM"&&(!selectedCategory||p.categoria==selectedCategory)&&(!q||[p.nome,p.descricao,p.parceiro,p.categoria].join(" ").toLowerCase().includes(q)));
a.sort((x,y)=>s=="priceAsc"?num(x.preco)-num(y.preco):s=="priceDesc"?num(y.preco)-num(x.preco):s=="name"?x.nome.localeCompare(y.nome,"pt"):((y.destaque||"").toUpperCase()=="SIM")-((x.destaque||"").toUpperCase()=="SIM"));
document.getElementById("count").textContent=a.length+" produto"+(a.length==1?"":"s");document.getElementById("grid").innerHTML=a.length?a.map(card).join(""):'<div class="empty">Nenhum produto encontrado.</div>'}
function card(p){let o=num(p.preco_anterior),v=num(p.preco),d=o>v?Math.round((1-v/o)*100):0;return '<article class="card"><div class="pic"><img src="'+esc(p.imagem)+'" alt="'+esc(p.nome)+'" loading="lazy">'+((p.destaque||"").toUpperCase()=="SIM"?'<span class="badge">⭐ Destaque</span>':'')+'</div><div class="body"><div class="cat">'+esc(p.categoria)+'</div><div class="title">'+esc(p.nome)+'</div><div class="desc">'+esc(p.descricao)+'</div><div class="prices">'+(o>v?'<span class="old">'+esc(p.preco_anterior)+'</span>':'')+'<span class="price">'+esc(p.preco)+'</span>'+(d?'<span class="discount">-'+d+'%</span>':'')+'</div><div class="partner">Disponível em '+esc(p.parceiro)+'</div><a class="btn" href="'+esc(p.url)+'" target="_blank" rel="noopener noreferrer sponsored" onclick="track(\\''+esc(p.nome)+'\\',\\''+esc(p.parceiro)+'\\')">Ver produto →</a></div></article>'}
function track(product,partner){if(window.gtag)gtag('event','partner_click',{product_name:product,partner:partner})}
document.getElementById("brand").textContent=BRAND_NAME;document.getElementById("subtitle").textContent=SUBTITLE;
load().catch(()=>document.getElementById("grid").innerHTML='<div class="empty">Erro ao carregar o Google Sheets.</div>');
</script></body></html>
