<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e0227a">
<title>Diário da Sofy</title>
<meta name="description" content="Links e descontos">
<style>
:root{--pink:#e0227a;--pink-dark:#b81862;--pink-light:#fdf1f7;--pink-pale:#fbe6f0}
*{box-sizing:border-box}
body{margin:0;background:var(--pink-pale);color:#171717;font-family:system-ui,-apple-system,Segoe UI,sans-serif;-webkit-text-size-adjust:100%}

header{background:linear-gradient(135deg,var(--pink),var(--pink-dark));color:#fff;text-align:center;padding:clamp(20px,6vw,32px) 16px}
.ig-wrap{display:flex;justify-content:center;margin-bottom:10px}
.ig-avatar-link{display:inline-block;border-radius:50%;padding:3px;background:rgba(255,255,255,.85)}
.ig-avatar{width:clamp(56px,16vw,76px);height:clamp(56px,16vw,76px);border-radius:50%;display:block;object-fit:cover;background:#fff}
h1{margin:0;font-size:clamp(20px,5vw,28px)}
header p{color:#ffe3f0;margin:6px auto 0;max-width:650px;font-size:clamp(13px,3.2vw,15px)}

main{max-width:1180px;margin:auto;padding:16px 12px 32px}
.controls{display:flex;gap:10px;flex-wrap:wrap}
input,select{padding:12px 13px;border:1px solid #f3c6dd;border-radius:12px;background:#fff;font-size:16px}
input{flex:1 1 180px;min-width:0}
select{flex:1 1 160px}
input:focus,select:focus{outline:none;border-color:var(--pink)}

.cats{display:flex;gap:8px;overflow-x:auto;padding:14px 0;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.cats::-webkit-scrollbar{height:4px}
.cats button{border:1px solid #f3c6dd;background:#fff;color:#171717;border-radius:99px;padding:9px 14px;white-space:nowrap;font-size:13px;flex:0 0 auto;min-height:38px}
.cats .active{background:var(--pink);border-color:var(--pink);color:#fff}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;justify-content:center}
@media(min-width:480px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,240px));gap:16px}}

.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 3px 16px #0001;display:flex;flex-direction:column}
.pic{position:relative;background:var(--pink-light);aspect-ratio:1}
.pic img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;padding:8px}
.badge{position:absolute;top:8px;left:8px;background:var(--pink);color:#fff;padding:5px 8px;border-radius:8px;font-size:11px}

.body{padding:12px;display:flex;flex-direction:column;flex:1}
.cat{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.02em}
.title{font-size:15px;font-weight:750;margin:4px 0;line-height:1.25}
.desc{font-size:13px;color:#777;line-height:1.4;min-height:36px}

.prices{display:flex;align-items:baseline;gap:6px;margin:9px 0;flex-wrap:wrap}
.old{text-decoration:line-through;color:#999;font-size:12px}
.price{font-size:18px;font-weight:850;color:var(--pink-dark)}
.discount{font-size:11px;font-weight:750;color:var(--pink)}

.partner{font-size:11px;color:#777;margin-bottom:8px}
.btn{display:block;text-align:center;text-decoration:none;background:var(--pink);color:#fff;padding:12px;border-radius:11px;font-weight:750;font-size:14px;transition:background .15s;min-height:44px}
.btn:hover{background:var(--pink-dark)}

.count{font-size:12px;color:#777;margin:0 0 10px}
.empty{text-align:center;padding:40px 16px;color:#777;grid-column:1/-1}
footer{text-align:center;color:#888;font-size:11px;padding:20px 16px}

@media(min-width:640px){.title{font-size:16px}.price{font-size:20px}.body{padding:15px}}
</style>
</head>
<body>
<header>
<div class="ig-wrap">
<a id="igLink" class="ig-avatar-link" href="#" target="_blank" rel="noopener noreferrer">
<img id="igAvatar" class="ig-avatar" src="" alt="Foto de perfil Instagram" onerror="this.parentElement.parentElement.style.display='none'">
</a>
</div>
<h1 id="brand">Links e descontos</h1>
<p id="subtitle">Diário da Sofy</p>
</header>
<main>
<div class="controls">
<input id="search" placeholder="🔎 Pesquisar produtos..." oninput="render()">
<select id="sort" onchange="render()">
<option value="featured">Destaques primeiro</option><option value="priceAsc">Preço menor → maior</option>
<option value="priceDesc">Preço maior → menor</option><option value="name">Nome A → Z</option>
</select>
</div>
<div id="cats" class="cats"></div><div id="count" class="count"></div><div id="grid" class="grid"></div>
</main>
<footer>Alguns links podem ser links de afiliado. A compra é efetuada diretamente no parceiro.</footer>
<script>
/* IMPORTANTE:
   O URL abaixo tem de ser o de EXPORTAÇÃO em CSV da Google Sheet, não o link de partilha/visualização.
   Formato: https://docs.google.com/spreadsheets/d/SEU_ID/export?format=csv&gid=SEU_GID
   - SEU_ID: o ID que aparece no URL da folha (entre /d/ e /edit)
   - gid=0 corresponde normalmente à primeira aba; se os dados estiverem noutra aba, muda o gid
     (vê o número depois de "gid=" no URL da folha quando tens essa aba aberta)
   A folha também tem de estar partilhada como "Qualquer pessoa com o link" (leitor).
*/
const SHEET_CSV_URL="https://docs.google.com/spreadsheets/d/1EOmLMeyr1qAnZreTuKBlGpbbcYQzy-HrH9Nlu7U2ato/export?format=csv&gid=0";
const BRAND_NAME="Diário da Sofy";
const SUBTITLE="Links e descontos";

/* INSTAGRAM:
   O Instagram bloqueia o carregamento direto da foto de perfil a partir de outro site (hotlinking).
   Para mostrares a tua foto aqui, tens de:
   1) Guardar a foto de perfil (print/download) e fazer upload a um alojamento de imagens
      (ex: imgur.com, ou um ficheiro no teu Google Drive partilhado como "Qualquer pessoa com o link",
      usando o formato https://lh3.googleusercontent.com/d/SEU_ID — o link de partilha normal do Drive
      não funciona diretamente como imagem)
   2) Colar esse link direto em INSTAGRAM_AVATAR_URL abaixo
   Se deixares por preencher, o espaço da foto fica automaticamente escondido.
*/
const INSTAGRAM_URL="https://www.instagram.com/diariodasofy40/";
const INSTAGRAM_AVATAR_URL="https://marcoantoniosilvarosa.github.io/insta_perfil.jpeg";

let products=[],selectedCategory="";
function parseCSV(t){let a=[],r=[],c="",q=false;for(let i=0;i<t.length;i++){let x=t[i],n=t[i+1];if(x=='"'&&q&&n=='"'){c+='"';i++}else if(x=='"')q=!q;else if(x==','&&!q){r.push(c);c=""}else if((x=='\n'||x=='\r')&&!q){if(x=='\r'&&n=='\n')i++;r.push(c);if(r.some(v=>v.trim()))a.push(r);r=[];c=""}else c+=x}if(c||r.length){r.push(c);a.push(r)}let h=a.shift().map(v=>v.trim().toLowerCase());return a.map(v=>Object.fromEntries(h.map((k,i)=>[k,(v[i]||"").trim()])))}
function num(v){return parseFloat(String(v||"").replace(/[^\d,.-]/g,"").replace(/\.(?=\d{3}(?:\D|$))/g,"").replace(",", "."))||0}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function demo(){return[{ativo:"SIM",nome:"Produto de exemplo",categoria:"Destaques",imagem:"https://placehold.co/700x700?text=Produto",preco:"199,90 €",preco_anterior:"249,90 €",descricao:"Substitua este produto pelos seus dados.",parceiro:"Loja parceira",url:"https://example.com",destaque:"SIM"}]}
async function load(){products=SHEET_CSV_URL.startsWith("COLE_")?demo():parseCSV(await(await fetch(SHEET_CSV_URL)).text());buildCats();render()}
function buildCats(){let c=[...new Set(products.filter(p=>p.ativo.toUpperCase()=="SIM").map(p=>p.categoria).filter(Boolean))].sort();document.getElementById("cats").innerHTML='<button class="active" onclick="setCat(this,\'\')">Todos</button>'+c.map(x=>'<button onclick="setCat(this,\''+esc(x)+'\')">'+esc(x)+'</button>').join("")}
function setCat(e,c){selectedCategory=c;document.querySelectorAll(".cats button").forEach(x=>x.classList.remove("active"));e.classList.add("active");render()}
function render(){let q=document.getElementById("search").value.toLowerCase(),s=document.getElementById("sort").value;
let a=products.filter(p=>p.ativo.toUpperCase()=="SIM"&&(!selectedCategory||p.categoria==selectedCategory)&&(!q||[p.nome,p.descricao,p.parceiro,p.categoria].join(" ").toLowerCase().includes(q)));
a.sort((x,y)=>s=="priceAsc"?num(x.preco)-num(y.preco):s=="priceDesc"?num(y.preco)-num(x.preco):s=="name"?x.nome.localeCompare(y.nome,"pt"):((y.destaque||"").toUpperCase()=="SIM")-((x.destaque||"").toUpperCase()=="SIM"));
document.getElementById("count").textContent=a.length+" produto"+(a.length==1?"":"s");document.getElementById("grid").innerHTML=a.length?a.map(card).join(""):'<div class="empty">Nenhum produto encontrado.</div>'}
function card(p){let o=num(p.preco_anterior),v=num(p.preco),d=o>v?Math.round((1-v/o)*100):0;return '<article class="card"><div class="pic"><img src="'+esc(p.imagem)+'" alt="'+esc(p.nome)+'" loading="lazy">'+((p.destaque||"").toUpperCase()=="SIM"?'<span class="badge">⭐ Destaque</span>':'')+'</div><div class="body"><div class="cat">'+esc(p.categoria)+'</div><div class="title">'+esc(p.nome)+'</div><div class="desc">'+esc(p.descricao)+'</div><div class="prices">'+(o>v?'<span class="old">'+esc(p.preco_anterior)+'</span>':'')+'<span class="price">'+esc(p.preco)+'</span>'+(d?'<span class="discount">-'+d+'%</span>':'')+'</div><div class="partner">Disponível em '+esc(p.parceiro)+'</div><a class="btn" href="'+esc(p.url)+'" target="_blank" rel="noopener noreferrer sponsored" onclick="track(\''+esc(p.nome)+'\',\''+esc(p.parceiro)+'\')">Ver produto →</a></div></article>'}
function track(product,partner){if(window.gtag)gtag('event','partner_click',{product_name:product,partner:partner})}

document.getElementById("brand").textContent=BRAND_NAME;
document.getElementById("subtitle").textContent=SUBTITLE;
document.getElementById("igLink").href=INSTAGRAM_URL;
if(INSTAGRAM_AVATAR_URL){document.getElementById("igAvatar").src=INSTAGRAM_AVATAR_URL}else{document.querySelector(".ig-wrap").style.display="none"}

load().catch(()=>document.getElementById("grid").innerHTML='<div class="empty">Erro ao carregar o Google Sheets.</div>');
</script></body></html>
